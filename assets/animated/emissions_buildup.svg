  <rect class="g" style="animation-delay:2.30s" x="290" y="242" width="382.2" height="20" rx="4" fill="#1baf7a"/>
  <text class="v f" style="animation-delay:2.50s" x="680.2" y="256">26,626 t · 13%</text>
