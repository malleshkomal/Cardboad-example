  <text class="v f" style="animation-delay:3.25s" x="510.1" y="358">14,775 t · 7%</text>
  <text x="280" y="391" class="v" text-anchor="end">Cat 2 – Capital goods</text>
  <rect class="g" style="animation-delay:3.30s" x="290" y="378" width="175.8" height="20" rx="4" fill="#1baf7a"/>
  <text class="v f" style="animation-delay:3.50s" x="473.8" y="392">12,250 t · 6%</text>
  <text x="280" y="425" class="v" text-anchor="end">Cat 9 – Downstream transport</text>
