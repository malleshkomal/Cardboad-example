<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Animated: corporate footprint by scope and Scope 3 category</title>
  <desc id="d">Total 511,098 t CO2e: Scope 1 202,029 t, Scope 2 market-based 107,900 t, Scope 3 201,170 t. Scope 3 categories: Cat 1 – Purchased goods &amp; services 52,951 t; Cat 3 – Fuel- &amp; energy-related 40,932 t; Cat 4 – Upstream transport 26,626 t; Cat 10 – Processing of sold products 24,443 t; Cat 5 – Waste in operations 20,025 t; Cat 12 – End-of-life treatment 14,775 t; Cat 2 – Capital goods 12,250 t; Cat 9 – Downstream transport 4,940 t; Cat 7 – Employee commuting 3,599 t; Cat 6 – Business travel 630 t.</desc>
  <style>
    .s{font-size:12.5px;fill:#52514e} .v{font-size:12px;fill:#52514e} .w{font-size:13px;font-weight:700;fill:#ffffff}
    @keyframes grow{0%{transform:scaleX(0)}12%,100%{transform:scaleX(1)}}
    @keyframes fade{0%,8%{opacity:0}16%,100%{opacity:1}}
    .g{transform-box:fill-box;transform-origin:left center;animation:grow 10s cubic-bezier(.2,.7,.2,1) infinite both}
    .f{animation:fade 10s infinite both}
    @media (prefers-reduced-motion: reduce){.g,.f{animation:none}}
  </style>
  <rect width="1200" height="560" rx="16" fill="#fcfcfb"/>
  <text x="30" y="40" font-size="22" font-weight="800" fill="#0b0b0b">Where do 511k t CO₂e come from?</text>
  <text x="30" y="62" class="s">Reporting year 2025 · GHG Protocol · Scope 2 market-based · fictional data</text>
  <rect class="g" style="animation-delay:0.0s" x="30.0" y="80" width="450.6" height="44" rx="4" fill="#2a78d6"/>
  <text class="w f" style="animation-delay:0.3s" x="255.3" y="100" text-anchor="middle">Scope 1 · direct</text>
  <text class="w f" style="animation-delay:0.3s" x="255.3" y="117" text-anchor="middle" font-weight="400">202k t · 40%</text>
  <rect class="g" style="animation-delay:0.6s" x="482.6" y="80" width="238.7" height="44" rx="4" fill="#eb6834"/>
  <text class="w f" style="animation-delay:0.8999999999999999s" x="601.0" y="100" text-anchor="middle">Scope 2 · electricity (market-based)</text>
  <text class="w f" style="animation-delay:0.8999999999999999s" x="601.0" y="117" text-anchor="middle" font-weight="400">108k t · 21%</text>
  <rect class="g" style="animation-delay:1.2s" x="723.3" y="80" width="446.7" height="44" rx="4" fill="#1baf7a"/>
  <text class="w f" style="animation-delay:1.5s" x="945.6" y="100" text-anchor="middle">Scope 3 · value chain</text>
  <text class="w f" style="animation-delay:1.5s" x="945.6" y="117" text-anchor="middle" font-weight="400">201k t · 39%</text>
  <text x="30" y="156" font-size="16" font-weight="800" fill="#0b0b0b">Scope 3 broken down into its categories</text>
  <text x="280" y="187" class="v" text-anchor="end">Cat 1 – Purchased goods &amp; services</text>
