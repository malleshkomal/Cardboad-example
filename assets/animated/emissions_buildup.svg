  <text class="v f" style="animation-delay:3.75s" x="368.9" y="426">4,940 t · 2%</text>
  <text x="280" y="459" class="v" text-anchor="end">Cat 7 – Employee commuting</text>
  <rect class="g" style="animation-delay:3.80s" x="290" y="446" width="51.6" height="20" rx="4" fill="#1baf7a"/>
  <text class="v f" style="animation-delay:4.00s" x="349.6" y="460">3,599 t · 2%</text>
  <text x="280" y="493" class="v" text-anchor="end">Cat 6 – Business travel</text>
  <rect class="g" style="animation-delay:4.05s" x="290" y="480" width="9.0" height="20" rx="4" fill="#1baf7a"/>
  <text class="v f" style="animation-delay:4.25s" x="307.0" y="494">630 t · 0%</text>
  <rect x="30" y="522" width="1140" height="44" rx="10" fill="#e8f7f1"/>
  <text x="48" y="549" class="s"><tspan font-weight="700" fill="#0f7a54">Read it:</tspan> the top 4 categories make up 72% of Scope 3, so supplier data for purchased goods (Cat 1) and energy upstream (Cat 3) matter most.</text>
</svg>