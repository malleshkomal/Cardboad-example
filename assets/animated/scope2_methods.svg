<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Animated: Scope 2 location-based vs market-based</title>
  <desc id="d">232 GWh of electricity flows two ways. Location-based multiplies all of it by the grid average of 0.363 kg CO2 per kWh, giving 84,232 t. Market-based splits it: 25 percent covered by renewable certificates at zero, 75 percent at the residual mix of 0.62 kg per kWh, giving 107,900 t.</desc>
  <style>
    .h{font-size:16px;font-weight:700;fill:#0b0b0b}
    .s{font-size:12.5px;fill:#52514e}
    .big{font-size:26px;font-weight:800}
    .ln{fill:none;stroke-width:3;stroke-dasharray:10 5;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-30}}
    @keyframes grow{0%{transform:scaleX(0)}25%,85%{transform:scaleX(1)}100%{transform:scaleX(1)}}
    .bar{transform-box:fill-box;transform-origin:left center;animation:grow 6s ease-out infinite}
    @media (prefers-reduced-motion: reduce){.ln,.bar{animation:none}}
  </style>
  <rect width="1200" height="470" rx="16" fill="#fcfcfb"/>
  <text x="30" y="40" font-size="22" font-weight="800" fill="#0b0b0b">Scope 2: one electricity bill, two answers</text>
  <text x="30" y="62" class="s">The GHG Protocol requires both methods. Market-based counts the contracts you buy; location-based counts the grid you are connected to.</text>

  <!-- source -->
  <rect x="30" y="190" width="220" height="100" rx="12" fill="#fff6e0" stroke="#eda100" stroke-width="2"/>
  <text x="140" y="225" text-anchor="middle" font-size="30">⚡</text>
  <text x="140" y="256" text-anchor="middle" class="h">Electricity use</text>
  <text x="140" y="276" text-anchor="middle" class="s">232 GWh / year, all sites</text>

  <!-- paths -->
  <path id="pL" class="ln" stroke="#9a9890" d="M250,215 C320,215 330,125 420,125"/>
  <path id="pG" class="ln" stroke="#1baf7a" d="M250,240 C330,240 340,280 420,280"/>
  <path id="pR" class="ln" stroke="#eb6834" d="M250,265 C330,265 340,370 420,370"/>
  <circle r="7" fill="#9a9890"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#pL"/></animateMotion></circle>
  <circle r="7" fill="#1baf7a"><animateMotion dur="1.8s" begin=".6s" repeatCount="indefinite"><mpath href="#pG"/></animateMotion></circle>
  <circle r="7" fill="#eb6834"><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite"><mpath href="#pR"/></animateMotion></circle>

  <!-- method boxes -->
  <text x="420" y="92" font-size="12" font-weight="800" fill="#52514e" letter-spacing=".06em">LOCATION-BASED</text>
  <rect x="420" y="98" width="320" height="58" rx="10" fill="#f0efec" stroke="#c3c2b7"/>
  <text x="438" y="122" class="h" font-size="14">100 % × German grid mix</text>
  <text x="438" y="143" class="s">0.363 kg CO₂e / kWh (UBA)</text>

  <text x="420" y="240" font-size="12" font-weight="800" fill="#52514e" letter-spacing=".06em">MARKET-BASED</text>
  <rect x="420" y="250" width="320" height="58" rx="10" fill="#e8f7f1" stroke="#1baf7a"/>
  <text x="438" y="274" class="h" font-size="14">25 % with Guarantees of Origin / PPA</text>
  <text x="438" y="295" class="s">0 kg CO₂e / kWh (renewable contract)</text>
  <rect x="420" y="340" width="320" height="58" rx="10" fill="#fdeee7" stroke="#eb6834"/>
  <text x="438" y="364" class="h" font-size="14">75 % without certificates</text>
  <text x="438" y="385" class="s">0.62 kg CO₂e / kWh (AIB residual mix)</text>

  <path class="ln" stroke="#9a9890" d="M740,127 H800"/>
  <path class="ln" stroke="#1baf7a" d="M740,279 C775,279 770,320 800,320"/>
  <path class="ln" stroke="#eb6834" d="M740,369 C775,369 770,330 800,330"/>

  <!-- results -->
  <rect x="800" y="90" width="370" height="76" rx="12" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="818" y="124" class="big" fill="#52514e">84,232 t</text>
  <text x="980" y="124" class="s">CO₂e location-based</text>
  <rect class="bar" x="818" y="138" width="259" height="14" rx="4" fill="#9a9890"/>

  <rect x="800" y="285" width="370" height="76" rx="12" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="818" y="319" class="big" fill="#b8461a">107,900 t</text>
  <text x="990" y="319" class="s">CO₂e market-based ✔ reported</text>
  <rect class="bar" x="818" y="333" width="332" height="14" rx="4" fill="#eb6834"/>

  <rect x="30" y="416" width="1140" height="40" rx="10" fill="#f0efec"/>
  <text x="48" y="441" class="s"><tspan font-weight="700" fill="#0b0b0b">Why is market-based higher?</tspan> Certified green power is claimed by its buyers, so the leftover "residual mix" is dirtier than the grid average. More renewable contracts (lever L01) cut it fastest.</text>
</svg>
